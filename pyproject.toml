[project]
name = "rtfm-agent"
version = "0.1.0"
description = "Build Your Own RTFM For Me Agent - codingchallenges.fyi"
requires-python = ">=3.12"
dependencies = [
    "redis>=5.2",
    "fastembed>=0.5",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "huggingface-hub>=0.30",
    "tokenizers>=0.20",
    "onnxruntime>=1.19",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "mcp>=1.26",
    "trafilatura>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools]
packages = [
    "rtfm_agent",
    "rtfm_agent.api",
    "rtfm_agent.common",
    "rtfm_agent.crawler",
    "rtfm_agent.ingestion",
    "rtfm_agent.prompts",
    "rtfm_agent.retrieval",
    "rtfm_agent.routing",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
