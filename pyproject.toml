[project]
name = "rtfm-agent"
version = "0.1.0"
description = "Build Your Own RTFM For Me Agent - codingchallenges.fyi"
requires-python = ">=3.12"
dependencies = [
    "redis>=5.2",
    "fastembed>=0.5",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "huggingface-hub>=0.30",
    "tokenizers>=0.20",
    "onnxruntime>=1.19",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.9",
    "mcp>=1.26",
]

[tool.setuptools]
packages = ["rtfm_agent"]